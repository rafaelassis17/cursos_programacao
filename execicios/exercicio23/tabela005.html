<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Execicio de tabela</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      table {
        width: 500px;
        border-collapse: collapse;
      }

      caption {
        font-size: 1.2em;
        font-weight: bolder;
        padding: 8px;
      }
      th,
      td {
        border: 1px solid black;
        padding: 8px;
      }

      .cnome{
        background-color: lightblue;
      }

      .csexo{
        background-color: yellowgreen;
      }
      .amarelo{
        background-color: yellow;
      }
        .vermelho{
        background-color: red;
        }
    </style>
  </head>

  <body>
    <table>
        <colgroup>
<col class="amarelo">
<col class="vermelho" span="2">
<col class="amarelo">

        </colgroup>
      <caption></caption>
      <tr>
        <th scope="col">Nome</th>
        <th scope="col">Sexo</th>
        <th scope="col">Idade</th>
        <th scope="col">Profissião</th>
      </tr>
      <td>Ana Maria</td>
      <td>F</td>
      <td>25</td>
      <td>Jornalista</td>
      <tr></tr>
      <tr>
        <td>Rafael</td>
        <td>M</td>
        <td>30</td>
        <td>Engenheiro</td>
      </tr>
      <tr>
        <td >Beatriz</td>
        <td>F</td>
        <td>28</td>
        <td>Advogada</td>
      </tr>
      <tr>
        <td>Cláudia</td>
        <td>F</td>
        <td>22</td>
        <td>Estudante</td>
      </tr>
      <tr>
        <td>Gustavo</td>
        <td>M</td>
        <td>35</td>
        <td>Médico</td>
      </tr>
      <tr>
        <td>Marcos</td>
        <td>M</td>
        <td>27</td>
        <td>Programador</td>
      </tr>
    </table>
  </body>
</html>
