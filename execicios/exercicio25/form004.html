<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados pessoais</legend>
            <div>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required>
            </div>            <label for="iemail">E-mail</label>
                <input type="email" name="email" id="iemail" autocomplete="email" required>
                <div>
                    <label for="itelefone">Telefone</label>
                    <input type="tel" name="telefone" id="itelefone" autocomplete="tel"  required placeholder="(xx)xxxx-xxxx">
                </div>
        </fieldset>
            <!-- Estudar mais sobre RegEx-->
            <div>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </div>
        </div>
    </form>
</body>
</html>
