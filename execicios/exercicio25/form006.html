<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>
        Exemplo de Formulário
    </h1>
    <form action="#" method="post" autocomplete="on">
        <div>
                <label for="icor">Cor</label>
                <input type="color" name="cor" id="icor" value="#00ff00">
        </div>
        <div>
            <label for="inivel">Nível de Sastifação: </label>
            <input type="range" nome="nivel" id="inivel" min="1" max="5" value="1">
        </div>
        <div>
            <label for="ifoto">Foto do perfil: </label>
            <input type="file" nome="foto" id="ifoto">
        </div>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>

    </form>
</body>
</html>
