<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>
  <body>
    <h1>Formulário</h1>
    <form action="#" method="post" autocomplete="on">
        <div>
            <label for="iest">Estado:</label>
            <select name="est" id="iest">
                <option>=== Escolha ===</option>
                <optgroup label="Rigião">
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="SP">São Paulo</option>
                    <option value="AM" selected>Amazonas</option>
                </optgroup>

                <optgroup label="Rigião">
                <option value="AC">ACRE</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="Bh">Bahia</option>
                </optgroup>
            </select>
        </div>
        <div>
            <label for="iprof">Profissão: </label>
            <input type="text" name="prof" id="iprof" list="lstprof">
            <datalist id="lstprof">
                <option value="ADM">Administração</option>
                <option value="TI">Programação</option>
                <option value="PROF">Professor</option>
                <option value="AD">Advogado</option>
            </datalist>
        </div>
        <div>
            <label for="imsg">Mensagem</label><br>
            <textarea name="msg" id="imsg" cols="20" rows="10"></textarea>
        </div>
      <div>
        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
      </div>
    </form>
  </body>
</html>
