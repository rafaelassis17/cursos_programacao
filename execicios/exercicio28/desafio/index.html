<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: aliceblue;
            text-shadow: 1px 1px 1px black;
            text-align: center;
            border-radius: 7px;
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-rows: 100px 50px 1fr 50px;
            grid-template-columns: 1fr 150px;
            gap: 10px;
        }

        .topo {
            background-color: brown;
            /* grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 4; */
            grid-area: 1 / 1 / span 1 / span 2;
        }

        .menu {
            background-color: blueviolet;
            /*grid-row-start: 2;
            grid-row-end: 3;
            grid-column-start: 1;
            grid-column-end: span 3;*/
            grid-area: 2 / 1 / span 1 / span 2;
        }

        .principal {
            background-color: aquamarine;
            /* grid-row-start: 3;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 3;*/
            grid-area: 3/1 / span 1 / span 1;
        }

        .secundario {
            background-color: blue;
            /*grid-row-start: 3;
            grid-row-end: 4;
            grid-column-start:  3;
            grid-column-end: 4;*/
            grid-area: 3/2 / span 1 / span 1;
        }

        .rodape {
            background-color: burlywood;
            /* grid-row-start: 4;
            grid-row-end: 5;
            grid-column-start: 1;
            grid-column-end: -1;*/
            grid-area: 4/1 / span 1/ span 2;
        }
    </style>
</head>

<body>
    <header class="topo">
        <p>Topo</p>
    </header>
    <nav class="menu">
        <p>Menu</p>
    </nav>

    <main class="principal">
        <p>Principal</p>
    </main>

    <aside class="secundario">
        <p>Secundario</p>
    </aside>

    <footer class="rodape">
        <p>Rodapé</p>
    </footer>
</body>

</html>
