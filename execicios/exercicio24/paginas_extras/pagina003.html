<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
        <style>
        body{
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <a href="#" onclick="clicou()">Clique aqui</a>
    <div id="saida"></div>
    <script>
        function clicou(){
            s = window.document.getElementById("saida");
            s.innerHTML += "Você clicou no link";
        }
    </script>
</body>
</html>
