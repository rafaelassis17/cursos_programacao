<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos DOM</title>
    <style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        background-color: aquamarine;
        color: rgb(54, 34, 4);
    }
    input
    {
        font-size: 20px;
        padding: 5px;
    }
    div#res
    {
        margin-top: 20px;
        font-size: 25px;
    }
    </style>
</head>
<body>
<h1>Somando Valores</h1>
<input type="number" name="valor1" id="valor1"> +
<input type="number" name="valor2" id="valor2">
<input type="button" value="somar" onclick="somar()">
<div id="res">Resultado</div>

<script>
    function somar(){
        let v1 = document.getElementById('valor1')
        let v2 = document.querySelector('#valor2')
        let res = document.querySelector('#res')
        let n1 = Number(v1.value)
        let n2 = Number(v2.value)
        let s = n1 + n2
        res.innerHTML = `A soma entre ${n1} e ${n2} é igual a: <strong>${s}</strong>`
    }
</script>
</body>
</html>
