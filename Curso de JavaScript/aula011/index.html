<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site</title>
</head>

<body>
    <h1>Sistema de Multas</h1>
    <label for="vel">Velocidade:</label>
    <input type="number" name="txtvel" id="vel">
    <input type="button" value="Verificar" onclick="calcular()">
<div id="res">

</div>
    <script>

        function calcular() {
            let vel = document.getElementById('vel');
            let res = document.getElementById('res');
            let txtvel = Number(vel.value);
            res.innerHTML = `<P>Sua velocidade é de <b>${txtvel}</b> Km/h. </P><br>`;
            if (txtvel > 60){
                res.innerHTML +=` <p>Você está acima do limite de velocidade! VOU PEGAR SEU CARRO! VC É UM FILHO DE PUTA! </p>`
            }else if(txtvel == 60){
                res.innerHTML += `<p>Você está no limite de velocidade!</p>`
            }else if (txtvel < 60){
                res.innerHTML += `<p>Tudo certo!</p>`
            }else{
                res.innerHTML += `<p>Valor inválido! digita essa merda direito!</p>`
            }
            res.innerHTML += `<P> Dirija sempre usando cinto de segurança! </P>`;
        }
    </script>
</body>

</html>
